name: homeserver-prod

services:
  web:
    image: homeserver:dev

    env_file:
      - path: /opt/homeserver/home_media_server/.env
        format: raw

    command:
      - sh
      - -c
      - |
        python manage.py collectstatic --noinput &&
        exec gunicorn --workers 3 --bind 0.0.0.0:8000 config.wsgi:application

    volumes:
      - type: bind
        source: /opt/homeserver/home_media_server/db.sqlite3
        target: /app/db.sqlite3
        bind:
          create_host_path: false

      - type: bind
        source: /srv/media/homeserver/media
        target: /srv/media/homeserver/media
        read_only: false
        bind:
          create_host_path: false

      - type: bind
        source: /srv/media/homeserver/protect_media
        target: /srv/media/homeserver/protect_media
        read_only: false
        bind:
          create_host_path: false
      - type: volume
        source: staticfiles
        target: /app/staticfiles
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine

    ports:
      - "127.0.0.1:18081:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro

    depends_on:
      - web

    restart: unless-stopped

volumes:
  staticfiles:
