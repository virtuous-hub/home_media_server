<div class="modal" id="photo-modal">

    <span class="modal-close" onclick="closePhoto()">×</span>

    <div id="photo-date" class="photo-date"></div>


     <div class="photo-viewer">

        <button
            type="button"
            class="nav-arrow modal-nav modal-nav-left"
            id="photo-prev"
            aria-label="Предыдущее фото">
            ←
        </button>

        <img
            id="modal-image"
            class="modal-image"
            src=""
            alt="Фото"
        >

        <button
            type="button"
            class="nav-arrow modal-nav modal-nav-right"
            id="photo-next"
            aria-label="Следующее фото">
            →
        </button>

    </div>

    <div class="photo-actions">

    <a id="download-button"
       class="download-button"
       href="#"
       >
        Скачать
    </a>

    <form id="delete-form" method="post">
        {% csrf_token %}
        <input
            type="hidden"
            name="next"
            id="delete-next"
            value="{{ request.get_full_path }}"
        >

        <button type="submit" class="delete-button">
            Удалить
        </button>
    </form>

</div>
</div>
